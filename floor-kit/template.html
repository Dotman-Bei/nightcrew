<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor</title>
<style>
  :root {
    --bg: #dedad3;
    --surface: #d3cec6;
    --ink: #0a0a0a;
    --muted: #55514c;
    --accent: #256f82;
    --accent-ink: #ffffff;
    --line: rgba(10, 10, 10, 0.14);
    --radius: 6px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 32px; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 16px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px 12px; color: var(--ink); background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius); }
  button { font: inherit; font-weight: 500; padding: 10px 24px; margin-top: 16px; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: var(--radius); cursor: pointer; }
  button:hover { filter: brightness(0.92); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  output { display: block; margin-top: 24px; padding: 16px; background: var(--surface); border-radius: var(--radius); }
</style>
</head>
<body>
<main>
  <h1>Floor</h1>
  <p>One line on what this tool does.</p>
</main>
<script>
  const snapshot = JSON.parse(document.getElementById("snapshot").textContent);
</script>
</body>
</html>
